<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDN Freight · Homepage options</title>
<style>
  /* Presenter view: one option at a time, full screen, switch with the bar or the keyboard. */
  :root { --bar: #0d1526; --line: rgba(255,255,255,.1); --text: #e8edf7; --muted: #8b97b1; --red: #e0344f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1a2135; color: var(--text); font: 400 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .bar { position: fixed; inset: 0 0 auto 0; height: 56px; background: var(--bar); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 16px; z-index: 10; transition: transform .25s; }
  body.hide-bar .bar { transform: translateY(-100%); }
  .bar img { height: 36px; }
  .bar .title { font-weight: 600; white-space: nowrap; }
  .bar .title small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .group { display: flex; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .group button { background: none; border: 0; padding: 7px 14px; border-radius: 6px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .group button[aria-pressed="true"] { background: #fff; color: #0d1526; }
  .spacer { flex: 1; }
  .nav { display: flex; gap: 6px; }
  .nav button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-size: 16px; }
  .nav button:hover { border-color: #fff; }
  .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .hint kbd { font: 600 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--text); }

  .stage { position: fixed; inset: 56px 0 0 0; display: flex; justify-content: center; align-items: stretch; transition: inset .25s; }
  body.hide-bar .stage { inset: 0; }
  .frame { width: 100%; height: 100%; border: 0; background: #fff; transition: width .3s; }
  body.phone .stage { align-items: center; padding: 24px 0; }
  body.phone .frame { width: 390px; height: min(844px, 100%); border-radius: 36px; border: 10px solid #0b0f1a; box-shadow: 0 30px 80px rgba(0,0,0,.5); }

  .notes { position: fixed; top: 72px; right: 16px; width: 340px; max-height: calc(100% - 88px); overflow: auto; background: rgba(13,21,38,.96); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; z-index: 9; display: none; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
  body.show-notes .notes { display: block; }
  body.hide-bar .notes { top: 16px; max-height: calc(100% - 32px); }
  .notes h3 { margin: 0 0 4px; font-size: 16px; }
  .notes .tag { color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .notes ul { margin: 12px 0 0; padding-left: 18px; color: #cdd5e6; }
  .notes li { margin-bottom: 8px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(13,21,38,.92); border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px; color: var(--muted); font-size: 12.5px; z-index: 11; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.on { opacity: 1; }

  @media (max-width: 900px) { .hint, .bar .title small { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <img src="../logo.png" alt="MDN Freight">
  <div class="title">Homepage options<small>Design concepts · sample content</small></div>
  <div class="group" role="group" aria-label="Option">
    <button data-opt="0" aria-pressed="true">1 · Dark</button>
    <button data-opt="1" aria-pressed="false">2 · Bright</button>
  </div>
  <div class="group" role="group" aria-label="Device">
    <button data-dev="desktop" aria-pressed="true">Desktop</button>
    <button data-dev="phone" aria-pressed="false">Phone</button>
  </div>
  <div class="spacer"></div>
  <span class="hint"><kbd>←</kbd> <kbd>→</kbd> switch · <kbd>P</kbd> phone · <kbd>N</kbd> notes · <kbd>H</kbd> hide bar</span>
  <div class="nav"><button id="prev" aria-label="Previous option">←</button><button id="next" aria-label="Next option">→</button></div>
</div>

<div class="stage"><iframe class="frame" title="Homepage option" src="d-dark.html"></iframe></div>

<aside class="notes" aria-live="polite"></aside>
<div class="toast">Press <b>H</b> to bring the bar back</div>

<script>
  const options = [
    { src: 'd-dark.html', name: 'Option 1 · Dark', notes: [
      'Stands out: the carrier sites we looked at are mostly light. This one is not.',
      'Video of a truck on the road shows they move freight before anyone reads a word.',
      'Navy and red come straight from the logo, so the brand carries the whole page.',
      'Panels keep each section easy to scan, even with a lot of information.'
    ]},
    { src: 'e-bright.html', name: 'Option 2 · Bright', notes: [
      'Familiar and approachable: reads like an established, trustworthy company.',
      'Logo’s red bar reused as a highlight, so the brand is recognisable at a glance.',
      'White and grey sections alternate, so long pages stay easy to follow.',
      'Lighter backgrounds tend to read well for longer text, like service pages.'
    ]}
  ];
  const frame = document.querySelector('.frame');
  const notes = document.querySelector('.notes');
  const toast = document.querySelector('.toast');
  let current = 0;

  function show(i) {
    current = (i + options.length) % options.length;
    frame.src = options[current].src;
    document.querySelectorAll('[data-opt]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.opt === current)));
    notes.innerHTML = `<span class="tag">Why this option</span><h3>${options[current].name}</h3><ul>${options[current].notes.map(n => `<li>${n}</li>`).join('')}</ul>`;
  }
  function device(d) {
    document.body.classList.toggle('phone', d === 'phone');
    document.querySelectorAll('[data-dev]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dev === d)));
  }
  function toggleBar() {
    const hidden = document.body.classList.toggle('hide-bar');
    if (hidden) { toast.classList.add('on'); setTimeout(() => toast.classList.remove('on'), 1800); }
  }

  document.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => show(+b.dataset.opt)));
  document.querySelectorAll('[data-dev]').forEach(b => b.addEventListener('click', () => device(b.dataset.dev)));
  document.getElementById('prev').addEventListener('click', () => show(current - 1));
  document.getElementById('next').addEventListener('click', () => show(current + 1));

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'arrowright') show(current + 1);
    else if (k === 'arrowleft') show(current - 1);
    else if (k === '1' || k === '2') show(+k - 1);
    else if (k === 'p') device(document.body.classList.contains('phone') ? 'desktop' : 'phone');
    else if (k === 'n') document.body.classList.toggle('show-notes');
    else if (k === 'h') toggleBar();
    else return;
    e.preventDefault();
  }
  document.addEventListener('keydown', onKey);
  // Keys still work after clicking into the page being presented (same origin).
  frame.addEventListener('load', () => { try { frame.contentWindow.addEventListener('keydown', onKey); } catch (_) {} });

  show(0);
</script>
</body>
</html>
